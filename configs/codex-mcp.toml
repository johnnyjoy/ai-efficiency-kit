# Merge selected entries into ~/.codex/config.toml. Do not replace the whole file.
[mcp_servers.serena]
command = "serena"
args = ["start-mcp-server", "--context", "codex", "--project-from-cwd"]

[mcp_servers.jcodemunch]
command = "uvx"
args = ["jcodemunch-mcp"]

[mcp_servers.jdocmunch]
command = "uvx"
args = ["jdocmunch-mcp"]

[mcp_servers.context7]
url = "https://mcp.context7.com/mcp"
