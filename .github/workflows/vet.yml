name: vet-skills

# Automated layer of the vetting process (see VETTING.md). Human review still required.
on:
  push:
  pull_request:

jobs:
  vet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install scanners
        run: |
          python -m pip install --upgrade pip
          pip install semgrep
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run vetting gate
        env:
          # Optional: add SNYK_TOKEN as a repo secret to enable Snyk Agent Scan.
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: bash vet-skills

      - name: Byte-compile installer
        run: python -m py_compile install.py
